# i3-like, SIP-free tiling for macOS.
config-version = 2

after-startup-command = []
start-at-login = true
exec-on-workspace-change = [
	'/bin/bash',
	'-c',
	'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE 2>/dev/null || true',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 24
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = []
on-focus-changed = []
automatically-unhide-macos-hidden-apps = false
persistent-workspaces = ['1', '2', '3', '4', '5']

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 8
outer.bottom = 8
# Reserve room for the SketchyBar at the top (the macOS menu bar is auto-hidden,
# so it reserves nothing). The built-in display still reserves the physical notch
# (~BAR_H), so it needs only an 8px gap; external displays need the full bar
# height + 8 = 40 so windows clear the bar with the same even gap as the sides.
outer.top = [{ monitor.'built-?in|color lcd|liquid retina' = 8 }, 40]
outer.right = 8

[mode.main.binding]
alt-enter = 'exec-and-forget open -na Ghostty'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

ctrl-alt-h = 'resize width -50'
ctrl-alt-j = 'resize height +50'
ctrl-alt-k = 'resize height -50'
ctrl-alt-l = 'resize width +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-left = 'move-workspace-to-monitor --wrap-around left'
alt-shift-right = 'move-workspace-to-monitor --wrap-around right'

alt-f = 'fullscreen'
alt-space = 'layout floating tiling'
alt-shift-q = 'close'
alt-b = 'balance-sizes'
alt-r = 'reload-config'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-shift-r = 'flatten-workspace-tree'
